ps:
  # Push-notification body labels for non-text messages, in Pashto.
  push:
    message:
      offer: "وړاندیز یې واستاوه"
      meetup: "د لیدنې وړاندیز یې وکړ"
      image: "انځور یې واستاوه"
      document: "سند یې واستاوه"
    # Push title for a reply from Hatiwal Support (the sender's stored name is
    # English; the title is shown by the OS, so it is localized here). Spelled
    # EXACTLY as the mobile app's in-app Support name, so the push and the
    # inbox row match — the brand spelling is the owner's call; change both.
    support:
      title: "د هټیوال ملاتړ"
  # Public unsubscribe page and bulk email footer (UnsubscribesController).
  unsubscribe:
    title: "د هټیوال له برېښنالیکونو ګډون لغوه کړئ"
    question: "آیا غواړئ د هټیوال اعلاني برېښنالیکونه نور تاسو ته رانشي؟ ستاسو د حساب په اړه پیغامونه به بیا هم درته رسېږي."
    confirm: "ګډون لغوه کړئ"
    done: "ستاسو ګډون لغوه شو"
    done_detail: "نور به د هټیوال اعلاني برېښنالیکونه تاسو ته رانشي."
    undo: "بېرته — برېښنالیکونه راته رالېږئ"
    undone: "تاسو بېرته ګډون وکړ"
    email_footer: "له دې برېښنالیکونو ګډون لغوه کړئ"
    invalid: "This unsubscribe link isn't valid."
  support:
    # First message a new account receives from Hatiwal Support
    # (WelcomeSupportMessageJob).
    welcome: "هټیوال ته ښه راغلاست! 👋 دا د هټیوال ملاتړ دی. که پوښتنه، ستونزه یا کوم نظر لرئ، همدلته یې راته ولیکئ. موږ هر پیغام لولو."
    # Ready-written Support messages (SupportNoticeJob).
    notices:
      user_verified: "مبارک شه %{name}! ✅ ستاسو د هټیوال حساب اوس تایید شو. پېرودونکي به ستاسو د نوم تر څنګ آبي د تایید نښه وویني، او په تاسو به ډېر باور وکړي. مننه چې د هټیوال برخه یاست!"
      user_verification_rejected: "سلام %{name}. مونږ ستاسو د تایید نښې غوښتنه وکتله، خو دا ځل مو ونه منله. لامل: %{reason}. تاسو همدا اوس له خپل پروفایل څخه بیا هڅه کولی شئ، یوازې ۲ دقیقې وخت نیسي."
      user_badge_revoked: "سلام %{name}. مونږ ستاسو د هټیوال له حساب څخه د تایید نښه لرې کړه. لامل: %{reason}. که فکر کوئ چې دا تېروتنه ده، دلته ځواب راکړئ. تاسو له خپل پروفایل څخه بیا غوښتنه کولی شئ."
  # VER-1: verification decision reasons, shown to the person (Support
  # message + status card). Keys = VerificationRequest::REJECT_REASONS + REVOKE_REASONS.
  verification:
    errors:
      already_requested: "یوه غوښتنه لا د کتنې لاندې ده."
      unknown_subject: "د تایید نامعلومه موضوع."
      daily_limit: "تاسو نن ۳ غوښتنې لېږلې دي. مهرباني وکړئ سبا بیا هڅه وکړئ."
    reasons:
      photo_not_clear: "انځور روښانه نه دی"
      name_mismatch: "نوم له سند سره سمون نه خوري"
      selfie_mismatch: "سیلفي نشته یا له سند سره سمون نه خوري"
      document_not_accepted: "دا سند نه منل کېږي"
      shop_sign_not_visible: "د دوکان لوحه نه ښکاري"
      policy_violation: "زموږ قواعد مات شوي"
      other: "بل"
  # VER-1 validation messages (VerificationRequest#subject_must_be_eligible).
  activerecord:
    errors:
      models:
        verification_request:
          attributes:
            subject:
              already_verified: "مخکې تایید شوی دی"
              not_eligible: "لا غوښتنه نه شي کولی (پاتې: %{missing})"
