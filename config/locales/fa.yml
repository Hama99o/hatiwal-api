fa:
  # Push-notification body labels for non-text messages, in Dari/Farsi.
  push:
    message:
      offer: "یک پیشنهاد ارسال کرد"
      meetup: "پیشنهاد ملاقات داد"
      image: "یک عکس فرستاد"
      document: "یک سند فرستاد"
    # Push title for a reply from Hatiwal Support (the sender's stored name is
    # English; the title is shown by the OS, so it is localized here).
    support:
      title: "پشتیبانی هتیوال"
  # Public unsubscribe page and bulk email footer (UnsubscribesController).
  unsubscribe:
    title: "لغو اشتراک ایمیل‌های هتیوال"
    question: "آیا می‌خواهید دیگر ایمیل‌های اطلاع‌رسانی هتیوال را دریافت نکنید؟ پیام‌های مربوط به حساب شما همچنان ارسال می‌شود."
    confirm: "لغو اشتراک"
    done: "اشتراک شما لغو شد"
    done_detail: "دیگر ایمیل‌های اطلاع‌رسانی هتیوال برای شما ارسال نمی‌شود."
    undo: "بازگشت — ایمیل‌ها را دریافت کنم"
    undone: "دوباره مشترک شدید"
    email_footer: "لغو اشتراک این ایمیل‌ها"
    invalid: "This unsubscribe link isn't valid."
  support:
    # First message a new account receives from Hatiwal Support
    # (WelcomeSupportMessageJob).
    welcome: "به هتیوال خوش آمدید! 👋 اینجا پشتیبانی هتیوال است. اگر سوال، مشکل یا پیشنهادی دارید، همین‌جا برای ما بنویسید. ما همه پیام‌ها را می‌خوانیم."
