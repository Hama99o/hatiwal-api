fa:
  # Push-notification body labels for non-text messages, in Dari/Farsi.
  push:
    message:
      offer: "یک پیشنهاد ارسال کرد"
      meetup: "پیشنهاد ملاقات داد"
      image: "یک عکس فرستاد"
      document: "یک سند فرستاد"
    # Push title for a reply from Hatiwal Support (the sender's stored name is
    # English; the title is shown by the OS, so it is localized here).
    support:
      title: "پشتیبانی هتیوال"
  # Public unsubscribe page and bulk email footer (UnsubscribesController).
  unsubscribe:
    title: "لغو اشتراک ایمیل‌های هتیوال"
    question: "آیا می‌خواهید دیگر ایمیل‌های اطلاع‌رسانی هتیوال را دریافت نکنید؟ پیام‌های مربوط به حساب شما همچنان ارسال می‌شود."
    confirm: "لغو اشتراک"
    done: "اشتراک شما لغو شد"
    done_detail: "دیگر ایمیل‌های اطلاع‌رسانی هتیوال برای شما ارسال نمی‌شود."
    undo: "بازگشت — ایمیل‌ها را دریافت کنم"
    undone: "دوباره مشترک شدید"
    email_footer: "لغو اشتراک این ایمیل‌ها"
    invalid: "This unsubscribe link isn't valid."
  support:
    # First message a new account receives from Hatiwal Support
    # (WelcomeSupportMessageJob).
    welcome: "به هتیوال خوش آمدید! 👋 اینجا پشتیبانی هتیوال است. اگر سوال، مشکل یا پیشنهادی دارید، همین‌جا برای ما بنویسید. ما همه پیام‌ها را می‌خوانیم."
    # Ready-written Support messages (SupportNoticeJob).
    notices:
      user_verified: "تبریک %{name}! ✅ حساب هتیوال شما اکنون تایید شد. خریداران نشان آبی تایید را کنار نام شما می‌بینند و بیشتر به شما اعتماد می‌کنند. سپاس که بخشی از هتیوال هستید!"
      user_verification_rejected: "سلام %{name}. درخواست نشان تایید شما را بررسی کردیم، اما این بار نتوانستیم آن را تایید کنیم. دلیل: %{reason}. همین حالا می‌توانید از پروفایل خود دوباره تلاش کنید؛ فقط ۲ دقیقه وقت می‌گیرد."
      user_badge_revoked: "سلام %{name}. نشان تایید را از حساب هتیوال شما برداشتیم. دلیل: %{reason}. اگر فکر می‌کنید اشتباه شده، همین‌جا پاسخ دهید. می‌توانید از پروفایل خود دوباره درخواست دهید."
  # VER-1: verification decision reasons, shown to the person (Support
  # message + status card). Keys = VerificationRequest::REJECT_REASONS + REVOKE_REASONS.
  verification:
    errors:
      already_requested: "یک درخواست هنوز در حال بررسی است."
      unknown_subject: "موضوع تایید نامعلوم است."
      daily_limit: "امروز ۳ درخواست فرستاده‌اید. لطفاً فردا دوباره تلاش کنید."
      owner_only: "فقط مالک یا مدیر دوکان می‌تواند برای نشان تایید آن درخواست دهد."
    reasons:
      photo_not_clear: "عکس واضح نیست"
      name_mismatch: "نام با سند شما مطابقت ندارد"
      selfie_mismatch: "سلفی وجود ندارد یا با سند مطابقت ندارد"
      document_not_accepted: "این سند پذیرفته نمی‌شود"
      shop_sign_not_visible: "تابلوی دکان دیده نمی‌شود"
      policy_violation: "قوانین ما رعایت نشده"
      other: "دیگر"
  # VER-1 validation messages (VerificationRequest#subject_must_be_eligible).
  activerecord:
    errors:
      models:
        verification_request:
          attributes:
            subject:
              already_verified: "قبلاً تایید شده است"
              not_eligible: "هنوز نمی‌تواند درخواست دهد (کم است: %{missing})"
