ur:
  # Push-notification body labels for non-text messages, in Urdu.
  #
  # Missing until 2026-10-01 although `ur` was a valid preferred_language: with
  # no ur.yml, `ur` is not an available locale, so I18n.with_locale("ur") RAISED
  # and every photo/offer/meetup/document push to an Urdu user failed.
  push:
    message:
      offer: "پیشکش بھیجی"
      meetup: "ملاقات کی تجویز دی"
      image: "تصویر بھیجی"
      document: "دستاویز بھیجی"
    # Push title for a reply from Hatiwal Support (the sender's stored name is
    # English; the title is shown by the OS, so it is localized here). Spelled
    # EXACTLY as the mobile app's in-app Support name, so the push and the
    # inbox row match — the brand spelling is the owner's call; change both.
    support:
      title: "ہتیوال سپورٹ"
  # Public unsubscribe page and bulk email footer (UnsubscribesController).
  unsubscribe:
    title: "ہتیوال کی ای میلز سے ان سبسکرائب کریں"
    question: "کیا آپ ہتیوال کی اعلانی ای میلز مزید وصول نہیں کرنا چاہتے؟ آپ کے اکاؤنٹ سے متعلق پیغامات پھر بھی آپ کو ملیں گے۔"
    confirm: "ان سبسکرائب کریں"
    done: "آپ ان سبسکرائب ہو گئے ہیں"
    done_detail: "اب آپ کو ہتیوال کی اعلانی ای میلز نہیں ملیں گی۔"
    undo: "واپس — ای میلز ملتی رہیں"
    undone: "آپ دوبارہ سبسکرائب ہو گئے"
    email_footer: "ان ای میلز سے ان سبسکرائب کریں"
    invalid: "This unsubscribe link isn't valid."
  support:
    # First message a new account receives from Hatiwal Support
    # (WelcomeSupportMessageJob).
    welcome: "ہتیوال میں خوش آمدید! 👋 یہ ہتیوال سپورٹ ہے۔ اگر آپ کا کوئی سوال، مسئلہ یا تجویز ہو تو یہیں ہمیں لکھیں۔ ہم ہر پیغام پڑھتے ہیں۔"
    # Ready-written Support messages (SupportNoticeJob).
    notices:
      user_verified: "مبارک ہو %{name}! ✅ آپ کا ہتیوال اکاؤنٹ اب تصدیق شدہ ہے۔ خریدار آپ کے نام کے ساتھ نیلا تصدیقی نشان دیکھیں گے اور آپ پر زیادہ بھروسہ کریں گے۔ ہتیوال کا حصہ بننے کا شکریہ!"
      user_verification_rejected: "السلام علیکم %{name}۔ ہم نے تصدیقی نشان کے لیے آپ کی درخواست دیکھی، لیکن اس بار اسے منظور نہیں کر سکے۔ وجہ: %{reason}۔ آپ ابھی اپنی پروفائل سے دوبارہ کوشش کر سکتے ہیں؛ صرف ۲ منٹ لگتے ہیں۔"
      user_badge_revoked: "السلام علیکم %{name}۔ ہم نے آپ کے ہتیوال اکاؤنٹ سے تصدیقی نشان ہٹا دیا ہے۔ وجہ: %{reason}۔ اگر آپ کو لگتا ہے کہ یہ غلطی ہے تو یہاں جواب دیں۔ آپ اپنی پروفائل سے دوبارہ درخواست دے سکتے ہیں۔"
  # VER-1: verification decision reasons, shown to the person (Support
  # message + status card). Keys = VerificationRequest::REJECT_REASONS + REVOKE_REASONS.
  verification:
    errors:
      already_requested: "ایک درخواست پہلے سے زیر جائزہ ہے۔"
      unknown_subject: "تصدیق کا نامعلوم موضوع۔"
      daily_limit: "آپ آج ۳ درخواستیں بھیج چکے ہیں۔ براہ کرم کل دوبارہ کوشش کریں۔"
      owner_only: "صرف دکان کا مالک ہی اس کے تصدیقی نشان کے لیے درخواست دے سکتا ہے۔"
    reasons:
      photo_not_clear: "تصویر واضح نہیں ہے"
      name_mismatch: "نام آپ کی دستاویز سے میل نہیں کھاتا"
      selfie_mismatch: "سیلفی موجود نہیں یا دستاویز سے میل نہیں کھاتی"
      document_not_accepted: "یہ دستاویز قبول نہیں ہے"
      shop_sign_not_visible: "دکان کا بورڈ نظر نہیں آ رہا"
      policy_violation: "ہمارے قواعد کی خلاف ورزی ہوئی"
      other: "دیگر"
  # VER-1 validation messages (VerificationRequest#subject_must_be_eligible).
  activerecord:
    errors:
      models:
        verification_request:
          attributes:
            subject:
              already_verified: "پہلے سے تصدیق شدہ ہے"
              not_eligible: "ابھی درخواست نہیں دے سکتا (کمی: %{missing})"
