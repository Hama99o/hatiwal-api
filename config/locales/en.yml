# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"
  accounts:
    auto_suspended_reason: "Automatically suspended after reaching %{count} warnings."
    blocked:
      default: "Your account has been blocked. Please contact support."
      suspended: "Your account has been suspended. Please contact support."
      banned: "Your account has been banned for violating our community rules."
      reason: "Reason: %{reason}"
  # Push-notification body labels for non-text messages (text messages show
  # their actual content). Rendered in the recipient's preferred_language.
  push:
    message:
      offer: "Sent an offer"
      meetup: "Proposed a meetup"
      image: "Sent a photo"
      document: "Sent a document"
    # Push title for a reply from Hatiwal Support (the sender's stored name is
    # English; the title is shown by the OS, so it is localized here).
    support:
      title: "Hatiwal Support"
  activerecord:
    errors:
      models:
        report:
          attributes:
            reportable_id:
              already_reported: "has already been reported by you"
        verification_request:
          attributes:
            subject:
              already_verified: "is already verified"
              not_eligible: "cannot apply yet (missing: %{missing})"
  # Attachment validation (AttachedFileValidator). The API does not switch
  # locale per request — validation errors are English and both clients display
  # the server string as-is — so these live in en.yml only, like every other
  # activerecord message above.
  errors:
    messages:
      invalid_file_type: "has an unsupported file type (%{content_type})"
      file_too_large: "is larger than the %{limit} limit"
      too_many_files: "cannot have more than %{count} files"
  # Public unsubscribe page and bulk email footer (UnsubscribesController).
  unsubscribe:
    title: "Unsubscribe from Hatiwal emails"
    question: "Stop receiving announcement emails from Hatiwal? Messages about your own account will still reach you."
    confirm: "Unsubscribe"
    done: "You're unsubscribed"
    done_detail: "You won't receive announcement emails from Hatiwal any more."
    undo: "Undo — keep receiving emails"
    undone: "You're subscribed again"
    email_footer: "Unsubscribe from these emails"
    invalid: "This unsubscribe link isn't valid."
  support:
    # First message a new account receives from Hatiwal Support
    # (WelcomeSupportMessageJob).
    welcome: "Welcome to Hatiwal! 👋 This is Hatiwal Support. If you have a question, a problem or an idea, just reply here. We read every message."
    # Ready-written Support messages (SupportNoticeJob).
    notices:
      user_verified: "Congratulations %{name}! ✅ Your Hatiwal account is now verified. Buyers will see the blue verified badge next to your name, so they can trust you more. Thank you for being part of Hatiwal!"
      user_verification_rejected: "Hello %{name}. We checked your request for the verified badge, but we could not approve it this time. Reason: %{reason}. You can try again now from your profile; it only takes 2 minutes."
      user_badge_revoked: "Hello %{name}. We have removed the verified badge from your Hatiwal account. Reason: %{reason}. If you think this is a mistake, reply here. You can apply again from your profile."
  # VER-1: verification decision reasons, shown to the person (Support
  # message + status card). Keys = VerificationRequest::REJECT_REASONS + REVOKE_REASONS.
  verification:
    reasons:
      photo_not_clear: "The photo is not clear"
      name_mismatch: "The name does not match your document"
      selfie_mismatch: "The selfie is missing or does not match the document"
      document_not_accepted: "This document is not accepted"
      shop_sign_not_visible: "The shop sign is not visible"
      policy_violation: "Our rules were broken"
      other: "Other"
