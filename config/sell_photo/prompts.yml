# Sell with a photo (docs/SELL_WITH_PHOTO.md): the English phrases CLIP's text
# model compares a photo with, per category slug. NEVER shown to anyone: the
# apps show the category's own localized name (name_ps / name_fa / name_en).
#
# A category is suggested only if its slug is here: property, stays, jobs,
# services and "other" are left out on purpose (a photo cannot tell them).
# Several phrases per category are averaged (prompt ensembling). Change a
# phrase -> re-run the measurement (docs/SELL_WITH_PHOTO.md §Measured).
