production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  reinstate_decayed_users:
    class: ReinstateDecayedUsersJob
    schedule: every day at 3am
  finalize_account_deletions:
    class: FinalizeAccountDeletionsJob
    schedule: every day at 4am
  reveal_overdue_reviews:
    class: RevealOverdueReviewsJob
    schedule: every day at 5am
  purge_verification_files:
    class: PurgeVerificationFilesJob
    schedule: every day at 2am
  # VID: videos of listings sold/expired/deleted 30+ days ago (docs/LISTING_VIDEO.md).
  purge_listing_videos:
    class: PurgeListingVideosJob
    schedule: every day at 2:30am
  # SHOP-MEDIA: photos + video of shops closed 30+ days ago (docs/SHOP_MEDIA.md).
  purge_shop_media:
    class: PurgeShopMediaJob
    schedule: every day at 2:45am
  # Listing expiry reminders, 7 days and 1 day before (owner, 2026-10-12).
  listing_expiry_reminders:
    class: ListingExpiryReminderJob
    schedule: every hour at minute 25
