# Starting list of prohibited terms (owner, 2026-10-13). Loaded ONCE into
# prohibited_terms by db/migrate/20261013100100_seed_prohibited_terms.rb and by
# `bin/rails prohibited_terms:seed`; both only ADD missing rows and never edit
# one. The migration runs once, so later deploys never bring back a term the
# admin deleted (a manual `prohibited_terms:seed` would). After that, the admin
# page "Prohibited terms" is where terms are kept.
#
# category => locale => [terms]. locale "any" = the same spelling in Pashto and
# Dari. Terms are normalized on save (ي→ی, ك→ک, آ→ا, no harakat / ZWNJ, digits
# to ASCII), so one spelling per variant is enough; ZWNJ words are listed both
# joined and spaced. A trailing "*" means "words starting with".
#
# NOT here on purpose, because they cause false positives:
#   * ALLOWED by the owner: knives (چاقو، چاړه), tobacco / cigarettes (سګرټ،
#     سیګار), naswar (نسوار), animals (sheep, birds, ...).
#   * شیشه (glass, also slang for meth), "gun" (glue gun, spray gun, massage
#     gun), "bullet" / "cartridge" (bullet camera, printer cartridge), ګولۍ
#     (bullet AND pill), "coke", "weed", "pot", "ice", "crack", "speed", "wine"
#     (a colour), "c4" / "m4" / "colt" (car models), "rpg" (game genre),
#     "alcohol" / الکل (rubbing alcohol, wipes), bare سلاح / اسلحه / وسله
#     ("سلاح سرد" = knives), bare "kidney" (kidney beans), "تابلیت" (tablet PC).
