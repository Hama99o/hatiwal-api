  "/api/v1/verification_requests/current":
    get:
      summary: the verification status card for the caller
      tags:
      - Verification
      security:
      - bearer: []
      parameters:
      - name: subject
        in: query
        required: false
        description: me (default). shop:<id> comes with SHOP-1.
        schema:
          type: string
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '401':
          description: requires authentication
        '200':
          description: rejected, its photos deleted after the keep period (request.files_purged)
  "/api/v1/verification_requests/{id}":
    delete:
      summary: cancel a waiting request (its photos are deleted at once)
      tags:
      - Verification
      security:
      - bearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: cancelled; the card is back to none
        '404':
          description: someone else's request
