  "/api/v1/my/listings":
    get:
      summary: list the caller's own listings, for one selling identity
      tags:
      - Listings
      parameters:
      - name: access-token
        in: header
        required: false
        schema:
          type: string
      - name: client
        in: header
        required: false
        schema:
          type: string
      - name: uid
        in: header
        required: false
        schema:
          type: string
      - name: selling_as
        in: query
        required: false
        description: 'OFFLINE §10.6 — `me` or a shop id: the identity the app caches
          this list under, whatever the server''s current "selling as" (a switch may
          still be queued on the phone). A shop the caller may not sell as → 422 `code:
          "shop_unavailable"`. Absent (1.1.x apps): the server''s current identity,
          as before.'
        schema:
          type: string
      responses:
        '200':
          description: the identity asked for (here the shop, while the server sells
            as Me)
        '422':
          description: a shop the caller may not sell as
    post:
      summary: create a listing (Me, or a shop the seller is in)
      tags:
      - Listings
      description: '`shop_id` (OFFLINE §10.6): the identity the listing is made under,
        as the app queued it (absent: the server''s current "selling as"). `listing.image_order`
        (phase 0): the photos'' order as tokens. Limited to 30 a day per seller: 429
        with `Retry-After` (seconds).'
      parameters:
      - name: access-token
        in: header
        required: false
        schema:
          type: string
      - name: client
        in: header
        required: false
        schema:
          type: string
      - name: uid
        in: header
        required: false
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        description: 'OFFLINE §10.1 — 8 to 64 letters, digits, - or _. A retry with
          the same key replays the first answer (same status and body, header `Idempotent-Replayed:
          true`; one write). The same key with another body → 422 `idempotency_key_reused`;
          while the first request still runs → 409 `idempotency_in_progress` (retry
          later); a malformed key → 422 `idempotency_key_invalid`. Without the header
          (1.1.x apps) nothing changes.'
        schema:
          type: string
      responses:
        '201':
          description: 'a retry with the same key: the FIRST answer replayed (Idempotent-Replayed:
            true), no second listing'
          headers:
            Idempotent-Replayed:
              schema:
                type: string
              description: '"true" on a replayed answer'
        '409':
          description: 'the first request with this key is still running: retry later'
        '422':
          description: the same key with a DIFFERENT request
        '429':
          description: 'over the daily limit: Retry-After says when (never a 429 replayed
            under a key)'
          headers:
            Retry-After:
              schema:
                type: integer
              description: seconds — the limit window's length
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shop_id:
                  type: string
                  nullable: true
                  description: OFFLINE §10.6 — `me` or a shop id
                listing:
                  type: object
                  properties:
                    title:
                      type: string
                    price:
                      type: number
                    currency:
                      type: string
                    category_id:
                      type: integer
                    status:
                      type: string
                      enum:
                      - draft
                      - active
                    image_order:
                      type: array
                      items:
                        type: string
                      description: 'Phase 0 — the photos'' order: `new:<n>` for the
                        n-th uploaded file'
