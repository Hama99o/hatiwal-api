  "/api/v1/support_conversation":
    post:
      summary: open (or return) the caller's thread with Hatiwal Support
      tags:
      - Conversations
      description: 'Idempotent. Creates the caller''s support conversation on first
        call, returns it after. Rendered like GET /conversations/:id (kind: "support",
        listing: null, viewer_role: null).'
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '401':
          description: requires authentication
        '200':
          description: the caller's support thread
  "/api/v1/users/me/location_guess":
    patch:
      summary: record a clue about where the signed-in user is
      tags:
      - Users
      description: The area the user searched in (`search_area`) or a GPS fix the
        app already had permission for (`gps`, at most once a day). The newest clue
        replaces the last. Ignored (still 204) when the user has an own address or
        the point is outside Afghanistan, Pakistan and Iran. Read the result from
        `location` on GET /users/me. Never public.
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '204':
          description: recorded (or ignored)
        '422':
          description: unknown source or missing coordinates
        '401':
          description: requires authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                latitude:
                  type: number
                  example: 34.3529
                longitude:
                  type: number
                  example: 62.204
                province:
                  type: string
                  example: Herat
                  nullable: true
                source:
                  type: string
                  enum:
                  - listing
                  - search_area
                  - gps
              required:
              - latitude
              - longitude
              - source
  "/api/v1/users/me":
    put:
      summary: report push registration (token, or why there is none)
      tags:
      - Users
      description: 'Send `push_token` once the app has one. When getting a token fails,
        send `push_registration_error` as "<stage>: <message>" (e.g. "token: Default
        FirebaseApp is not initialized"). The server keeps the last error only, strips
        control characters, caps it at 300 characters, and clears it when a token
        is saved. A blank string clears it too.'
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: stored; a reported error is kept until a token arrives
        '401':
          description: requires authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    push_token:
                      type: string
                      maxLength: 200
                      example: ExponentPushToken[xxxxxxxx]
                    push_registration_error:
                      type: string
                      maxLength: 300
                      example: 'token: Default FirebaseApp is not initialized'
              required:
              - user
  "/api/v1/users/{user_id}/sold_listings":
    get:
