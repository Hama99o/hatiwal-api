---
openapi: 3.0.1
info:
  title: Hatiwal API v1
  version: v1
  description: Local marketplace API for Afghanistan — no online payment, meetup-based
    transactions
paths:
  "/api/v1/listings":
    get:
      summary: browse active listings
      tags:
      - Listings
      description: Returns paginated active listings for buyers
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: category_id
        in: query
        required: false
        schema:
          type: integer
      - name: sort
        in: query
        required: false
        description: 'Sort order. Allowed values: newest (default), oldest, price_asc,
          price_desc, most_viewed, nearest. nearest requires latitude/longitude and
          falls back to newest when they are absent. Unknown values fall back to newest.'
        schema:
          type: string
      - name: latitude
        in: query
        required: false
        description: Buyer's latitude. Used for radius filtering and for sort=nearest.
        schema:
          type: number
      - name: longitude
        in: query
        required: false
        description: Buyer's longitude. Used for radius filtering and for sort=nearest.
        schema:
          type: number
      - name: radius
        in: query
        required: false
        description: Radius in kilometers — requires latitude and longitude.
        schema:
          type: number
      - name: seller_active_days
        in: query
        required: false
        description: When present, restricts results to listings whose seller's last_sign_in_at
          is within this many days. E.g. 7 returns listings from sellers active in
          the last week.
        schema:
          type: integer
      - name: price_dropped
        in: query
        required: false
        description: When present/true, restricts results to browsable listings with
          a recorded price reduction (listing_price_histories) within the last Listing::PRICE_DROP_WINDOW
          (14 days) — the same window used for the price-drop badge — the buyer 'Deals'
          filter.
        schema:
          type: boolean
      responses:
        '200':
          description: price_dropped=true composes with sort=nearest without a Postgres
            error
  "/api/v1/listings/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: saves_count reflects the number of SavedListing records (saved-by-N
        social proof)
      tags:
      - Listings
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '404':
          description: not found
        '200':
          description: saves_count is an integer, never a nested list of savers
  "/api/v1/listings/{id}/save":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: save a listing (bookmark)
      tags:
      - Listings
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: save is idempotent — saving twice still returns 200 and persists
            one record
        '401':
          description: unauthenticated user cannot save
  "/api/v1/listings/{id}/unsave":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    delete:
      summary: unsave a listing (remove bookmark)
      tags:
      - Listings
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: unsave is idempotent — calling when not saved still returns
            200
        '401':
          description: unauthenticated user cannot unsave
  "/api/v1/listings/{id}/similar":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: similar listings rail — respects 'Not interested'
      tags:
      - Listings
      description: Returns up to 8 browsable listings in the same category (and its
        child categories), excluding the source listing and anything the caller dismissed
        with "Not interested". Public — guests and authenticated users both have access.
      responses:
        '200':
          description: another user's dismissal does not shrink my rail
        '404':
          description: not found for non-existent listing
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
  "/api/v1/my/listings/{id}/renew":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    put:
      summary: renew one of the caller's own listings
      tags:
      - Listings
      description: |
        Seller lifecycle command. SF-B7 — a listing that fails validation
        (typically a legacy row that predates one of Listing's bounds) is
        answered with 422 and the field errors, never a 500 with an empty body.
      parameters:
      - name: access-token
        in: header
        required: false
        schema:
          type: string
      - name: client
        in: header
        required: false
        schema:
          type: string
      - name: uid
        in: header
        required: false
        schema:
          type: string
      responses:
        '401':
          description: unauthorized
        '200':
          description: successful
        '422':
          description: the listing fails validation
  "/api/v1/my/listings/{id}/unpublish":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    put:
      summary: unpublish one of the caller's own listings
      tags:
      - Listings
      description: |
        Seller lifecycle command. SF-B7 — a listing that fails validation
        (typically a legacy row that predates one of Listing's bounds) is
        answered with 422 and the field errors, never a 500 with an empty body.
      parameters:
      - name: access-token
        in: header
        required: false
        schema:
          type: string
      - name: client
        in: header
        required: false
        schema:
          type: string
      - name: uid
        in: header
        required: false
        schema:
          type: string
      responses:
        '401':
          description: unauthorized
        '200':
          description: successful
        '422':
          description: the listing fails validation
  "/api/v1/my/listings/{id}/activate":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    put:
      summary: activate one of the caller's own listings
      tags:
      - Listings
      description: |
        Seller lifecycle command. SF-B7 — a listing that fails validation
        (typically a legacy row that predates one of Listing's bounds) is
        answered with 422 and the field errors, never a 500 with an empty body.
      parameters:
      - name: access-token
        in: header
        required: false
        schema:
          type: string
      - name: client
        in: header
        required: false
        schema:
          type: string
      - name: uid
        in: header
        required: false
        schema:
          type: string
      responses:
        '401':
          description: unauthorized
        '200':
          description: successful
        '422':
          description: the listing fails validation
  "/api/v1/my/listings/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    put:
      summary: update one of the caller's own listings
      tags:
      - Listings
      description: |
        Edits a listing the caller owns. Photos are appended (never replaced) and
        removed by signed id via `removed_image_ids`.

        SF-B6 — changing `quantity` reconciles the listing's own status:

        * raising it above `sold_units` re-opens a `sold` listing as `active`,
          clears `sold_at`, and refreshes `expires_at` when the 30-day clock had
          already run out (so it comes back into the feed, not into the seller's
          Expired tab);
        * lowering it onto `sold_units` retires a live listing as `sold`;
        * lowering it BELOW `sold_units` is refused with 422 +
          `code: "quantity_below_sold_units"`. The seller's way out is to undo a
          sale first (`DELETE /api/v1/my/transactions/:id`, SF-B4).

        SF-B8 — the same endpoint enforces a second floor: lowering `quantity`
        below the units currently ON HOLD for a buyer is refused with 422 +
        `code: "quantity_below_held_units"`. The hold is never silently shrunk.
        The seller's way out is to release the hold
        (`PUT /api/v1/my/listings/:id/activate`) or set the quantity to at least
        the held count.

        The two floors report EXCLUSIVELY — whichever is higher raises the error,
        so `code` is one value and the minimum named in the message is always the
        minimum that actually works.
      parameters:
      - name: access-token
        in: header
        required: false
        schema:
          type: string
      - name: client
        in: header
        required: false
        schema:
          type: string
      - name: uid
        in: header
        required: false
        schema:
          type: string
      responses:
        '401':
          description: unauthorized
        '200':
          description: quantity raised — the sold-out listing re-opens with its stock
        '422':
          description: quantity below the units already sold
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                listing:
                  type: object
                  properties:
                    title:
                      type: string
                    price:
                      type: number
                    quantity:
                      type: integer
                      description: Total units; may not be below sold_units
        required: true
  "/api/v1/my/reviews/pending":
    get:
      summary: sold sales the caller still owes a review on
      tags:
      - Reviews
      description: Returns the caller's SOLD transactions (as buyer or seller) that
        they have not yet reviewed. Drives the rating prompt.
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '401':
          description: requires authentication
        '200':
          description: lists unreviewed sold sales
  "/api/v1/my/transactions":
    get:
      summary: list the caller's transactions (as buyer and/or seller)
      tags:
      - Transactions
      description: |
        Returns the current user's transactions — both the ones where they are
        the seller and the ones where they are the buyer. Optional `?as=buyer`
        or `?as=seller` narrows to a single role. TASK-TX01.
      parameters:
      - name: access-token
        in: header
        required: false
        schema:
          type: string
      - name: client
        in: header
        required: false
        schema:
          type: string
      - name: uid
        in: header
        required: false
        schema:
          type: string
      - name: as
        in: query
        required: false
        description: 'Optional role filter: ''buyer'' or ''seller'''
        schema:
          type: string
      - name: listing_id
        in: query
        required: false
        description: SF-B5 — narrow to one listing's ledger (the Sales screen)
        schema:
          type: integer
      - name: status
        in: query
        required: false
        description: 'Optional status filter: ''reserved'' or ''sold'''
        schema:
          type: string
      responses:
        '401':
          description: unauthorized
        '200':
          description: "?listing_id= narrows to one listing's ledger"
  "/api/v1/my/transactions/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    patch:
      summary: correct a recorded sale
      tags:
      - Transactions
      description: |
        SF-B4 — edit a sale the seller already recorded: its quantity, its price,
        and/or who it was to. `quantity: 0` means "this sale did not happen" and
        is handled exactly like DELETE.

        Restores stock, moves the trust counters, and reconciles the listing's own
        status (a `sold` listing re-opens as `active` when the correction leaves
        units unsold). Refused with 422 + `code: "sale_has_review"` when the sale
        already has a review AND the change would void it or move its buyer.
      parameters:
      - name: access-token
        in: header
        required: false
        schema:
          type: string
      - name: client
        in: header
        required: false
        schema:
          type: string
      - name: uid
        in: header
        required: false
        schema:
          type: string
      responses:
        '401':
          description: unauthorized
        '200':
          description: sale corrected; listing status and stock reconciled
        '422':
          description: the corrected quantity exceeds the listing's stock
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
                  description: New unit count; 0 voids the sale
                buyer_id:
                  type: integer
                  description: Reassign to another conversation participant
                clear_buyer:
                  type: boolean
                  description: Reassign to 'not on Hatiwal'
                final_price:
                  type: number
                  description: Per-unit price actually agreed
    delete:
      summary: void a recorded sale
      tags:
      - Transactions
      description: |
        SF-B4 — "Undo". Removes the sale, puts its units back in stock, gives back
        the seller's `sold_count` and the buyer's `bought_count` (never below
        zero), and re-opens the listing if this sale was what retired it.

        Refused with 422 + `code: "sale_has_review"` when the sale already has a
        review attached.
      parameters:
      - name: access-token
        in: header
        required: false
        schema:
          type: string
      - name: client
        in: header
        required: false
        schema:
          type: string
      - name: uid
        in: header
        required: false
        schema:
          type: string
      responses:
        '401':
          description: unauthorized
        '200':
          description: sale removed, stock restored, listing re-opened
        '422':
          description: the sale already has a review
  "/api/v1/reports":
    get:
      summary: list the current user's reports
      tags:
      - Reports
      description: Returns a paginated list of reports submitted by the authenticated
        user. Includes status, reason, and a safe reportable_label.
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '401':
          description: requires authentication
        '200':
          description: pagination meta is present
    post:
      summary: submit a report
      tags:
      - Reports
      description: Submits a polymorphic report against a Listing or User.
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '401':
          description: requires authentication
        '201':
          description: creates a report
        '422':
          description: rejects reporting own listing
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                report:
                  type: object
                  properties:
                    reportable_type:
                      type: string
                      enum:
                      - Listing
                      - User
                    reportable_id:
                      type: integer
                    reason:
                      type: string
                    description:
                      type: string
                  required:
                  - reportable_type
                  - reportable_id
                  - reason
  "/api/v1/transactions/{transaction_id}/reviews":
    post:
      summary: leave a review on a sold sale
      tags:
      - Reviews
      description: |
        The caller (a party to a SOLD transaction) rates the other party. The
        review is created hidden (double-blind) and revealed only once the
        counterparty also submits, or after the reveal window elapses.
      security:
      - bearer: []
      parameters:
      - name: transaction_id
        in: path
        required: true
        schema:
          type: integer
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '401':
          description: requires authentication
        '201':
          description: creates a hidden review
        '403':
          description: rejects a non-party
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                review:
                  type: object
                  properties:
                    rating:
                      type: integer
                      minimum: 1
                      maximum: 5
                    comment:
                      type: string
                  required:
                  - rating
  "/api/v1/users/{user_id}/reviews":
    get:
      summary: list a user's visible reviews
      tags:
      - Reviews
      description: Public, paginated list of the VISIBLE reviews a user has received.
        Optional ?role=of_seller|of_buyer.
      security:
      - bearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
      - name: role
        in: query
        required: false
        schema:
          type: string
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: returns only visible reviews
  "/api/v1/users/{user_id}/sold_listings":
    get:
      summary: list a seller's sold listings (public)
      tags:
      - Users
      description: |
        Returns a paginated list of sold listings for any publicly-active seller.
        Works for guests — authentication is optional. Returns 404 when the
        seller account has been deleted or is pending deletion.
      parameters:
      - name: user_id
        in: path
        required: true
        description: Seller's user ID
        schema:
          type: integer
      - name: page[number]
        in: query
        required: false
        description: 'Page number (default: 1)'
        schema:
          type: integer
      - name: access-token
        in: header
        required: false
        schema:
          type: string
      - name: client
        in: header
        required: false
        schema:
          type: string
      - name: uid
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: returns only that seller's sold listings (authenticated)
        '404':
          description: seller not found
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: api.hatiwal.com
- url: http://localhost:3007
  description: Local development
components:
  securitySchemes:
    bearer:
      type: apiKey
      name: access-token
      in: header
