  "/api/v1/conversations/{conversation_id}/messages":
    parameters:
    - name: conversation_id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: send a voice message
      tags:
      - Messages
      description: "`kind: \"voice_message\"` with the recording as `attachment` (multipart).\nAny
        of MP4/M4A, WebM or Ogg, ≤ 2 MB, 1 s – 2 min. The server re-encodes it\nto
        AAC `.m4a` (the one format every client plays), measures it and sets\n`body`
        to \"\U0001F3A4 m:ss\" (what apps ≤ 1.2.0 show). The answer carries\n`voice:
        { url, duration_ms, waveform }` (64 bars, 0–100).\nRefusals (422 `code`):
        voice_missing, voice_too_large, voice_too_short,\nvoice_too_long, voice_invalid.
        503 `voice_messages_unavailable` when the\nserver cannot take voice messages
        (`GET /app_config` features.voice_messages);\n503 `voice_busy` + `Retry-After`
        when another clip holds the transcoder (retry).\n60 voice messages an hour
        per user, inside the chat's 120 messages an hour.\n"
      parameters:
      - name: access-token
        in: header
        required: false
        schema:
          type: string
      - name: client
        in: header
        required: false
        schema:
          type: string
      - name: uid
        in: header
        required: false
        schema:
          type: string
      responses:
        '401':
          description: unauthorized
        '201':
          description: sent, re-encoded and measured
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: object
                    properties:
                      kind:
                        type: string
                        enum:
                        - voice_message
                      body:
                        type: string
                        description: "\"\U0001F3A4 m:ss\" — what apps ≤ 1.2.0 show"
                      voice:
                        type: object
                        nullable: true
                        description: null for any other kind, and once deleted
                        properties:
                          url:
                            type: string
                            description: the AAC .m4a
                          duration_ms:
                            type: integer
                          waveform:
                            type: array
                            items:
                              type: integer
                              minimum: 0
                              maximum: 100
                            minItems: 64
                            maxItems: 64
                        required:
                        - url
                        - duration_ms
                        - waveform
                    required:
                    - kind
                    - body
                    - voice
                required:
                - message
        '422':
          description: 'an HLS playlist renamed .m4a: voice_invalid, never processed'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: string
        required: true
  "/api/v1/my/analytics":
    get:
      summary: a seller's numbers, for Me or one shop they are on
      tags:
      - Listings
      description: |
        `shop_id`: a shop the caller is on (any role), or none for Me. Counts:
        total (not removed), active (live, not expired), expired, sold, draft,
        sales + units_sold (recorded sales), views (sum), chats (begun with this
        identity). Never site-wide. 403 `not_a_member` for another shop.
        A shop also gets `team` (owner 2026-10-08): one row per member
        {user {id, name, avatar_url}, role, posted, active, expired, sold}, sold
        = sales the member recorded; and `team_unattributed` {posted, active,
        expired, sold}: products of former members and sales recorded before
        recorded_by existed. Every member sees the whole team. Me: both null.
      parameters:
      - name: access-token
        in: header
        required: false
        schema:
          type: string
      - name: client
        in: header
        required: false
        schema:
          type: string
      - name: uid
        in: header
        required: false
        schema:
          type: string
      - name: shop_id
        in: query
        required: false
        schema:
          type: integer
      responses:
        '401':
          description: unauthorized
        '403':
          description: not on that shop's team
        '200':
          description: Me
          content:
            application/json:
              example:
                analytics:
                  shop:
                  total: 5
                  active: 2
                  expired: 1
                  sold: 1
                  draft: 1
                  sales: 0
                  units_sold: 0
                  views: 16
                  chats: 0
                  team:
                  team_unattributed:
  "/api/v1/my/listings/category_suggestion":
    post:
      summary: suggest a category for the first photo of a new listing
      tags:
      - My Listings
      description: 'Sell with a photo (docs/SELL_WITH_PHOTO.md). ONE photo, checked
        like a listing photo (type by its bytes, 10 MB max), embedded in memory and
        never stored. Answers the most likely category''s id (and its parent''s) with
        the model''s confidence, or 204 when it is not sure. No text: the apps show
        the category''s own localized name. Signed in only; 30 per 10 min per user,
        120 per IP. 503 code category_suggestion_unavailable when the server cannot
        suggest (GET /app_config features.category_suggestion is then false).'
      parameters:
      - name: access-token
        in: header
        required: false
        schema:
          type: string
      - name: client
        in: header
        required: false
        schema:
          type: string
      - name: uid
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: a suggestion
          content:
            application/json:
              schema:
                type: object
                properties:
                  category_id:
                    type: integer
                  parent_id:
                    type: integer
                    nullable: true
                  confidence:
                    type: number
                    description: 0..1; only answered at 0.40 or more
                required:
                - category_id
                - parent_id
                - confidence
        '204':
          description: 'not sure: no suggestion'
        '422':
          description: not a photo (code invalid_image)
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: string
              format: binary
        required: true
