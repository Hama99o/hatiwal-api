          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      tags:
      - Shops
      description: 'Find-or-create the caller''s one chat with the shop that has no
        product. 201 when created, 200 with the same chat after. `message` is optional.
        Refused: own shop / a shop you''re a member of (422 code own_shop), a shop
        that isn''t open (404), a blocked pair (422).'
      security:
      - bearer: []
      responses:
        '201':
          description: created; listing null, shop set
        '422':
          description: your own shop
        '404':
          description: a shop that isn't open
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
  "/api/v1/shops/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: a shop page (public)
      tags:
      - Shops
      responses:
        '200':
          description: the shop; phone only when phone_public
        '403':
          description: a suspended shop is not public
  "/api/v1/users/me/selling_as":
    patch:
      summary: choose who you sell as (null = Me)
      tags:
      - Shops
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: saved; me.selling_as_shop shows it
        '422':
          description: not a shop you are in
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shop_id:
                  type: integer
                  nullable: true
  "/api/v1/my/shops":
    get:
      summary: the shops you sell for
      tags:
      - Shops
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: paginated, with role and live product count
  "/api/v1/support_conversation":
    post:
      summary: open (or return) the caller's thread with Hatiwal Support
      tags:
      - Conversations
      description: 'Idempotent. Creates the caller''s support conversation on first
        call, returns it after. Rendered like GET /conversations/:id (kind: "support",
        listing: null, viewer_role: null). Owner, 2026-10-12: Support is per identity.
        Without shop_id, the caller''s own thread (Buyer mode and Seller as Me); with
        shop_id, that SHOP''s thread (members only, 403 otherwise), shared by its
        team and shown only while that shop is selected. GET /conversations lists
        each identity''s thread by its last message like any chat, not pinned (owner,
        2026-10-08; role=buying, role=selling&shop_id=none, role=selling&shop_id=<id>).
        It can be archived, never deleted. me.unread_counts.support is the person''s
        thread''s unread (also inside buying).'
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      - name: shop_id
        in: query
        required: false
        description: 'A shop the caller is a member of: that shop''s own Support thread'
        schema:
          type: integer
      responses:
        '403':
          description: shop_id names a shop the caller is not a member of
        '401':
          description: requires authentication
        '200':
          description: the caller's support thread
  "/api/v1/users/me/location_guess":
    patch:
      summary: record a clue about where the signed-in user is
      tags:
      - Users
      description: The area the user searched in (`search_area`) or a GPS fix the
        app already had permission for (`gps`, at most once a day). The newest clue
        replaces the last. Ignored (still 204) when the user has an own address or
        the point is outside Afghanistan, Pakistan and Iran. Read the result from
        `location` on GET /users/me. Never public.
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '204':
          description: recorded (or ignored)
        '422':
          description: unknown source or missing coordinates
        '401':
          description: requires authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                latitude:
                  type: number
                  example: 34.3529
                longitude:
                  type: number
                  example: 62.204
                province:
                  type: string
                  example: Herat
                  nullable: true
                source:
                  type: string
                  enum:
                  - listing
                  - search_area
                  - gps
              required:
              - latitude
              - longitude
              - source
  "/api/v1/users/me":
    put:
      summary: report push registration (token, or why there is none)
      tags:
      - Users
      description: |-
        Send `push_token` once the app has one. When getting a token fails, send `push_registration_error` as "<stage>: <message>" (e.g. "token: Default FirebaseApp is not initialized"). The server keeps the last error only, strips control characters, caps it at 300 characters, and clears it when a token is saved. A blank string clears it too.

        OFFLINE §10.2 — `user.base` (optional): for the fields a person edits by hand (firstname, lastname, phone, bio, city, province, whatsapp_number), the value the client saw. One changed elsewhere meanwhile is not overwritten: the rest applies and the answer is 409 `code: "edit_conflict"` + `fields`. Prefs and the push fields never conflict.
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        description: OFFLINE §10.1 — 8 to 64 letters, digits, - or _. A retry with
          the same key replays the first answer (one write); the same key with another
          body → 422.
        schema:
          type: string
      responses:
        '200':
          description: stored; a reported error is kept until a token arrives
        '409':
          description: OFFLINE §10.2 — a hand-edited field changed elsewhere since
            the client saw it
        '401':
          description: requires authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    push_token:
                      type: string
                      maxLength: 200
                      example: ExponentPushToken[xxxxxxxx]
                    push_registration_error:
                      type: string
                      maxLength: 300
                      example: 'token: Default FirebaseApp is not initialized'
                    base:
                      type: object
                      additionalProperties: true
                      description: OFFLINE §10.2 — per hand-edited field sent, the
                        value the client saw
              required:
              - user
  "/api/v1/users/{user_id}/sold_listings":
    get:
      summary: list a seller's sold listings (public)
      tags:
