---
openapi: 3.0.1
info:
  title: Hatiwal API v1
  version: v1
  description: Local marketplace API for Afghanistan — no online payment, meetup-based
    transactions
paths:
  "/api/v1/app_config":
    get:
      summary: which app version must run (force update / reminder)
      tags:
      - App
      description: 'Public. Platform from X-App-Platform (or ?platform=), version
        from X-App-Version (or ?version=). status: ok | soft (below latest: banner)
        | blocked (below minimum: full-screen block). A missing or malformed version
        is always ok. Cache-Control: public, max-age=60; Vary on both headers.'
      parameters:
      - name: X-App-Platform
        in: header
        required: false
        enum:
        - ios
        - android
        schema:
          type: string
        description: ":\n * `ios` \n * `android` \n "
      - name: X-App-Version
        in: header
        required: false
        example: 1.1.6
        schema:
          type: string
      responses:
        '200':
          description: blocked below the minimum
          content:
            application/json:
              schema:
                type: object
                properties:
                  platform:
                    type: string
                    nullable: true
                  min_version:
                    type: string
                    nullable: true
                  latest_version:
                    type: string
                    nullable: true
                  store_url:
                    type: string
                    nullable: true
                  status:
                    type: string
                    enum:
                    - ok
                    - soft
                    - blocked
                required:
                - platform
                - status
  "/api/v1/auth/apple":
    post:
      summary: Sign in (or up) with Apple
      tags:
      - Auth
      description: Verifies Apple's identity token (JWKS, iss, aud = bundle id, exp,
        SHA-256 nonce), finds the person by Apple id, links a verified email, or creates
        the account; returns the same tokens as email sign-in (headers + body). iOS
        only for now.
      parameters: []
      responses:
        '200':
          description: signed in (tokens in headers and body)
        '401':
          description: apple_token_invalid
        '422':
          description: apple_token_missing
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - identity_token
              - nonce
              properties:
                identity_token:
                  type: string
                  description: Apple's JWT
                nonce:
                  type: string
                  description: the RAW nonce (its SHA-256 was sent to Apple)
                authorization_code:
                  type: string
                  description: optional; kept only to revoke on account deletion
                given_name:
                  type: string
                  description: first sign-in only
                family_name:
                  type: string
                  description: first sign-in only
  "/api/v1/shops":
    post:
      summary: open your shop
      tags:
      - Shops
      description: Only name, category and location (pin + address line) are required.
        One shop per user (phase 1). The location must be in Afghanistan, Pakistan
        or Iran. Live at once unless SHOP_APPROVAL_REQUIRED is on, when it starts
        `pending`. Multipart for logo/cover; `hours` may be JSON.
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '403':
          description: email not confirmed
        '201':
          description: shop opened
        '422':
          description: outside the service area, or a second shop
        '401':
          description: requires authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shop:
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 2
                      maxLength: 50
                    description:
                      type: string
                      maxLength: 160
                    category_id:
                      type: integer
                    latitude:
                      type: number
                    longitude:
                      type: number
                    province:
                      type: string
                    city:
                      type: string
                    address_line:
                      type: string
                    phone:
                      type: string
                    phone_public:
                      type: boolean
                    hours:
                      type: object
                      example:
                        sat:
                        - - '08:00'
                          - '18:00'
                        fri: []
                  required:
                  - name
                  - category_id
                  - latitude
                  - longitude
                  - address_line
              required:
              - shop
          multipart/form-data:
            schema:
              type: object
              properties:
                shop:
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 2
                      maxLength: 50
                    description:
                      type: string
                      maxLength: 160
                    category_id:
                      type: integer
                    latitude:
                      type: number
                    longitude:
                      type: number
                    province:
                      type: string
                    city:
                      type: string
                    address_line:
                      type: string
                    phone:
                      type: string
                    phone_public:
                      type: boolean
                    hours:
                      type: object
                      example:
                        sat:
                        - - '08:00'
                          - '18:00'
                        fri: []
                  required:
                  - name
                  - category_id
                  - latitude
                  - longitude
                  - address_line
              required:
              - shop
  "/api/v1/verification_requests":
    post:
      summary: apply for the Verified badge (multipart)
      tags:
      - Verification
      description: 3 requests sent per day. Answers the status card; never a document.
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '403':
          description: email not confirmed
        '201':
          description: sent; the card says under review, with no document
        '422':
          description: a two-sided document needs its back
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document_type:
                  type: string
                  enum:
                  - e_tazkira
                name_on_document:
                  type: string
                document_number:
                  type: string
                  pattern: "^\\d{6,20}$"
                  description: the FULL number; kept encrypted, never returned
                front:
                  type: string
                  format: binary
                back:
                  type: string
                  format: binary
                  description: the back of the e-Tazkira
                selfie:
                  type: string
                  format: binary
                  description: holding the document
              required:
              - document_type
              - name_on_document
              - document_number
              - front
              - back
              - selfie
  "/api/v1/auth/confirmation":
    post:
      summary: send the confirmation link again
      tags:
      - Auth
      description: Resends the confirmation email. 5 per hour per IP (then 429).
      parameters: []
      responses:
        '200':
          description: sent
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
              - email
  "/api/v1/listings":
    get:
      summary: browse active listings
      tags:
      - Listings
      description: Returns paginated active listings for buyers
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: category_id
        in: query
        required: false
        schema:
          type: integer
      - name: sort
        in: query
        required: false
        description: 'Sort order. Allowed values: newest (default), oldest, price_asc,
          price_desc, most_viewed, nearest. nearest requires latitude/longitude and
          falls back to newest when they are absent. Unknown values fall back to newest.'
        schema:
          type: string
      - name: latitude
        in: query
        required: false
        description: Buyer's latitude. Used for radius filtering and for sort=nearest.
        schema:
          type: number
      - name: longitude
        in: query
        required: false
        description: Buyer's longitude. Used for radius filtering and for sort=nearest.
        schema:
          type: number
      - name: radius
        in: query
        required: false
        description: Radius in kilometers — requires latitude and longitude.
        schema:
          type: number
      - name: seller_active_days
        in: query
        required: false
        description: When present, restricts results to listings whose seller's last_sign_in_at
          is within this many days. E.g. 7 returns listings from sellers active in
          the last week.
        schema:
          type: integer
      - name: price_dropped
        in: query
        required: false
        description: When present/true, restricts results to browsable listings with
          a recorded price reduction (listing_price_histories) within the last Listing::PRICE_DROP_WINDOW
          (14 days) — the same window used for the price-drop badge — the buyer 'Deals'
          filter.
        schema:
          type: boolean
      responses:
        '200':
          description: price_dropped=true composes with sort=nearest without a Postgres
            error
          content:
            application/json:
              example:
                listings:
                - address:
