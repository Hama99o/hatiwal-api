      description: 'Multipart. `gallery[keep_ids][]`: the shop''s own photo ids (`gallery_photos[].id`)
        in the order to show; `gallery[photos][]`: new image files, appended. A photo
        left out of keep_ids is deleted. More than 5 → 422.'
      security:
      - bearer: []
      parameters: []
      responses:
        '200':
          description: the gallery, in order
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                keep_ids:
                  type: array
                  items:
                    type: string
                  description: the shop's own photo ids, in order
                photos:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: new photos, appended
  "/api/v1/shops/{shop_id}/reviews":
    get:
      summary: the shop's reviews (public)
      tags:
      - Shops
      description: Buyers' reviews of sales of this shop's products, newest first,
        paginated. A review of the owner as a buyer or of the owner's personal sales
        never appears. The shop page's avg_rating / review_count come from the same
        set. 404 for a closed shop.
      parameters:
      - name: shop_id
        in: path
        required: true
        schema:
          type: integer
      - name: page
        in: query
        required: false
        schema:
          type: integer
