  "/api/v1/listings/{id}/save":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: save a listing (bookmark)
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: 'OFFLINE §10.1 — 8 to 64 letters, digits, - or _. A retry with
          the same key replays the first answer (same status and body, header `Idempotent-Replayed:
          true`; one write). The same key with another body → 422 `idempotency_key_reused`;
          while the first request still runs → 409 `idempotency_in_progress` (retry
          later); a malformed key → 422 `idempotency_key_invalid`. Without the header
          (1.1.x apps) nothing changes.'
        schema:
          type: string
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      tags:
      - Listings
      security:
      - bearer: []
      responses:
        '200':
          description: save is idempotent — saving twice still returns 200 and persists
            one record
          content:
            application/json:
              example:
                saved: true
                id: 76
        '401':
          description: unauthenticated user cannot save
  "/api/v1/listings/{id}/unsave":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    delete:
      summary: unsave a listing (remove bookmark)
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: 'OFFLINE §10.1 — 8 to 64 letters, digits, - or _. A retry with
          the same key replays the first answer (same status and body, header `Idempotent-Replayed:
          true`; one write). The same key with another body → 422 `idempotency_key_reused`;
          while the first request still runs → 409 `idempotency_in_progress` (retry
          later); a malformed key → 422 `idempotency_key_invalid`. Without the header
          (1.1.x apps) nothing changes.'
        schema:
          type: string
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      tags:
      - Listings
      security:
      - bearer: []
      responses:
        '200':
          description: unsave is idempotent — calling when not saved still returns
            200
          content:
            application/json:
              example:
                saved: false
        '401':
          description: unauthenticated user cannot unsave
