        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '401':
          description: requires authentication
        '200':
          description: pagination meta is present
          content:
            application/json:
              example:
                reports:
                - created_at: '2026-10-30T23:04:23.966Z'
                  description: Detailed description
                  id: 22
                  reason: fraud
                  reportable_id: 1784
                  reportable_label: Sleek Silk Table
                  reportable_type: Listing
                  status: resolved
                - created_at: '2026-10-30T23:04:23.910Z'
                  description: This listing looks suspicious.
                  id: 21
                  reason: spam
                  reportable_id: 1783
                  reportable_label: Aerodynamic Granite Car
                  reportable_type: Listing
                  status: pending
                meta:
                  pagination:
                    current_page: 1
                    next_page:
                    prev_page:
                    total_count: 2
                    total_pages: 1
    post:
      summary: submit a report
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: 'OFFLINE §10.1 — 8 to 64 letters, digits, - or _. A retry with
          the same key replays the first answer (same status and body, header `Idempotent-Replayed:
          true`; one write). The same key with another body → 422 `idempotency_key_reused`;
          while the first request still runs → 409 `idempotency_in_progress` (retry
          later); a malformed key → 422 `idempotency_key_invalid`. Without the header
          (1.1.x apps) nothing changes.'
        schema:
          type: string
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      tags:
      - Reports
      description: Submits a polymorphic report against a Listing, a User, a Shop
        or (1.2.1) a voice Message. A Message must be a voice message the reporter
        received in one of their chats (abuse can come by voice); a text message,
        the reporter's own one, a deleted one or a stranger's chat is 422 / 404.
      security:
      - bearer: []
      responses:
        '401':
          description: requires authentication
        '201':
          description: reports a voice message the reporter received (1.2.1)
          content:
            application/json:
              example:
                message: Report submitted
        '422':
          description: rejects reporting own listing
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                report:
                  type: object
                  properties:
                    reportable_type:
                      type: string
                      enum:
                      - Listing
                      - User
                      - Shop
                      - Message
                    reportable_id:
                      type: integer
                    reason:
                      type: string
                    description:
                      type: string
                  required:
                  - reportable_type
                  - reportable_id
                  - reason
