---
openapi: 3.0.1
info:
  title: Hatiwal API v1
  version: v1
  description: Local marketplace API for Afghanistan — no online payment, meetup-based
    transactions
paths:
  "/api/v1/app_config":
    get:
      summary: which app version must run (force update / reminder)
      tags:
      - App
      description: 'Public. Platform from X-App-Platform (or ?platform=), version
        from X-App-Version (or ?version=). status: ok | soft (below latest: banner)
        | blocked (below minimum: full-screen block). A missing or malformed version
        is always ok. Cache-Control: public, max-age=60; Vary on both headers.'
      parameters:
      - name: X-App-Platform
        in: header
        required: false
        enum:
        - ios
        - android
        schema:
          type: string
        description: ":\n * `ios` \n * `android` \n "
      - name: X-App-Version
        in: header
        required: false
        example: 1.1.6
        schema:
          type: string
      responses:
        '200':
          description: blocked below the minimum
          content:
            application/json:
              schema:
                type: object
                properties:
                  platform:
                    type: string
                    nullable: true
                  min_version:
                    type: string
                    nullable: true
                  latest_version:
                    type: string
                    nullable: true
                  store_url:
                    type: string
                    nullable: true
                  status:
                    type: string
                    enum:
                    - ok
                    - soft
                    - blocked
                required:
                - platform
                - status
  "/api/v1/shops":
    post:
      summary: open your shop
      tags:
      - Shops
      description: Only name, category and location (pin + address line) are required.
        One shop per user (phase 1). The location must be in Afghanistan, Pakistan
        or Iran. Live at once unless SHOP_APPROVAL_REQUIRED is on, when it starts
        `pending`. Multipart for logo/cover; `hours` may be JSON.
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '403':
          description: email not confirmed
        '201':
          description: shop opened
        '422':
          description: outside the service area, or a second shop
        '401':
          description: requires authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shop:
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 2
                      maxLength: 50
                    description:
                      type: string
                      maxLength: 160
                    category_id:
                      type: integer
                    latitude:
                      type: number
                    longitude:
                      type: number
                    province:
                      type: string
                    city:
                      type: string
                    address_line:
                      type: string
                    phone:
                      type: string
                    phone_public:
                      type: boolean
                    hours:
                      type: object
                      example:
                        sat:
                        - - '08:00'
                          - '18:00'
                        fri: []
                  required:
                  - name
                  - category_id
                  - latitude
                  - longitude
                  - address_line
              required:
              - shop
          multipart/form-data:
            schema:
              type: object
              properties:
                shop:
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 2
                      maxLength: 50
                    description:
                      type: string
                      maxLength: 160
                    category_id:
                      type: integer
                    latitude:
                      type: number
                    longitude:
                      type: number
                    province:
                      type: string
                    city:
                      type: string
                    address_line:
                      type: string
                    phone:
                      type: string
                    phone_public:
                      type: boolean
                    hours:
                      type: object
                      example:
                        sat:
                        - - '08:00'
                          - '18:00'
                        fri: []
                  required:
                  - name
                  - category_id
                  - latitude
                  - longitude
                  - address_line
              required:
              - shop
  "/api/v1/verification_requests":
    post:
      summary: apply for the Verified badge (multipart)
      tags:
      - Verification
      description: 3 requests sent per day. Answers the status card; never a document.
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '403':
          description: email not confirmed
        '201':
          description: sent; the card says under review, with no document
        '422':
          description: a two-sided document needs its back
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document_type:
                  type: string
                  enum:
                  - e_tazkira
                name_on_document:
                  type: string
                document_number:
                  type: string
                  pattern: "^\\d{6,20}$"
                  description: the FULL number; kept encrypted, never returned
                front:
                  type: string
                  format: binary
                back:
                  type: string
                  format: binary
                  description: the back of the e-Tazkira
                selfie:
                  type: string
                  format: binary
                  description: holding the document
              required:
              - document_type
              - name_on_document
              - document_number
              - front
              - back
              - selfie
  "/api/v1/auth/confirmation":
    post:
      summary: send the confirmation link again
      tags:
      - Auth
      description: Resends the confirmation email. 5 per hour per IP (then 429).
      parameters: []
      responses:
        '200':
          description: sent
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
              - email
  "/api/v1/listings":
    get:
      summary: browse active listings
      tags:
      - Listings
      description: Returns paginated active listings for buyers
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: category_id
        in: query
        required: false
        schema:
          type: integer
      - name: sort
        in: query
        required: false
        description: 'Sort order. Allowed values: newest (default), oldest, price_asc,
          price_desc, most_viewed, nearest. nearest requires latitude/longitude and
          falls back to newest when they are absent. Unknown values fall back to newest.'
        schema:
          type: string
      - name: latitude
        in: query
        required: false
        description: Buyer's latitude. Used for radius filtering and for sort=nearest.
        schema:
          type: number
      - name: longitude
        in: query
        required: false
        description: Buyer's longitude. Used for radius filtering and for sort=nearest.
        schema:
          type: number
      - name: radius
        in: query
        required: false
        description: Radius in kilometers — requires latitude and longitude.
        schema:
          type: number
      - name: seller_active_days
        in: query
        required: false
        description: When present, restricts results to listings whose seller's last_sign_in_at
          is within this many days. E.g. 7 returns listings from sellers active in
          the last week.
        schema:
          type: integer
      - name: price_dropped
        in: query
        required: false
        description: When present/true, restricts results to browsable listings with
          a recorded price reduction (listing_price_histories) within the last Listing::PRICE_DROP_WINDOW
          (14 days) — the same window used for the price-drop badge — the buyer 'Deals'
          filter.
        schema:
          type: boolean
      responses:
        '200':
          description: price_dropped=true composes with sort=nearest without a Postgres
            error
  "/api/v1/listings/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: saves_count reflects the number of SavedListing records (saved-by-N
        social proof)
      tags:
      - Listings
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '404':
          description: not found
        '200':
          description: saves_count is an integer, never a nested list of savers
  "/api/v1/listings/{id}/save":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: save a listing (bookmark)
      tags:
      - Listings
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: save is idempotent — saving twice still returns 200 and persists
            one record
        '401':
          description: unauthenticated user cannot save
  "/api/v1/listings/{id}/unsave":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    delete:
      summary: unsave a listing (remove bookmark)
      tags:
      - Listings
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: unsave is idempotent — calling when not saved still returns
            200
        '401':
          description: unauthenticated user cannot unsave
  "/api/v1/listings/{id}/similar":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: similar listings rail — respects 'Not interested'
      tags:
      - Listings
      description: Returns up to 8 browsable listings in the same category (and its
        child categories), excluding the source listing and anything the caller dismissed
        with "Not interested". Public — guests and authenticated users both have access.
      responses:
        '200':
          description: another user's dismissal does not shrink my rail
        '404':
          description: not found for non-existent listing
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
  "/api/v1/conversations/{conversation_id}/messages":
    parameters:
    - name: conversation_id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: send a message in a conversation
      tags:
      - Messages
      description: |
        Sends a message in a conversation the caller participates in.

        SF-B11 — `offer_quantity` (optional, integer) states how many UNITS an
        offer is for. Only meaningful on `kind: "offer"` / `"offer_counter"`, and
        only on a multi-unit listing (`listing.multi_unit`).

        * **Nullable, and never defaulted to 1.** `null` means the sender said
          nothing about how many, which is what every offer sent before this
          field existed is; clients read `null` as one unit but must not show
          agreed-quantity UI for it. "Absent" and "one" are different facts.
        * **Discarded, not refused**, wherever it cannot mean anything — a
          non-offer kind, a single-item listing, an orphaned thread whose listing
          is gone. A single-item listing is untouched end to end: the response
          carries `offer_quantity: null` and no new failure mode exists for it.
        * **Refused when it exceeds `listing.available_units`** at the moment it
          is sent: 422 with `code: "offer_quantity_above_available_units"`. Never
          silently clamped — an offer is a proposal, and rewriting "I'll take 20"
          into "I'll take 12" would hand both sides a number neither chose.
        * A non-positive or fractional value is refused as an ordinary 422 with
          no `code` (it is a client bug, not something the sender can act on).

        **Reading the agreed quantity off an accepted offer:** an accept is a
        separate message (`kind: "offer_accepted"`) whose `responds_to_id` points
        at the offer it answers. Read `offer_amount` + `offer_quantity` off that
        offer, then pass the quantity through to `PUT /api/v1/my/listings/:id/sold`
        as its existing `quantity` param — no change to that endpoint.
      parameters:
      - name: access-token
        in: header
        required: false
        schema:
          type: string
      - name: client
        in: header
        required: false
        schema:
          type: string
      - name: uid
        in: header
        required: false
        schema:
          type: string
      responses:
        '401':
          description: unauthorized
        '201':
          description: offer for 3 of the 15 units
        '422':
          description: offer for more units than the listing has left
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  description: 'For offers: "amount|currency|listedPrice"'
                kind:
                  type: string
                  enum:
                  - text
                  - meetup_proposal
                  - meetup_accepted
                  - meetup_declined
                  - offer
                  - offer_accepted
                  - offer_declined
                  - document
                  - image_message
                  - offer_counter
                responds_to_id:
                  type: integer
                  nullable: true
                  description: Message being answered — must be in the SAME conversation
                offer_quantity:
                  type: integer
                  nullable: true
                  description: SF-B11 — units this offer is for; null means unspecified
                context:
                  type: object
                  nullable: true
                  description: 'Support thread only (1.1.6): where the message is
                    written from. mode buyer|seller; shop_id only with seller, and
                    only a shop the sender is in. Ignored in any other thread; an
                    invalid one → 422 code invalid_message_context. Older apps send
                    none (shown to the admin as unknown).'
                  properties:
                    mode:
                      type: string
                      enum:
                      - buyer
                      - seller
                    shop_id:
                      type: integer
                      nullable: true
              required:
              - body
        required: true
  "/api/v1/my/listings/{id}/renew":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    put:
      summary: renew one of the caller's own listings
      tags:
      - Listings
      description: |
        Seller lifecycle command. SF-B7 — a listing that fails validation
        (typically a legacy row that predates one of Listing's bounds) is
        answered with 422 and the field errors, never a 500 with an empty body.
      parameters:
      - name: access-token
        in: header
        required: false
        schema:
          type: string
      - name: client
        in: header
        required: false
        schema:
          type: string
      - name: uid
        in: header
        required: false
        schema:
          type: string
      responses:
        '401':
          description: unauthorized
        '200':
          description: successful
        '422':
          description: the listing fails validation
  "/api/v1/my/listings/{id}/unpublish":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    put:
      summary: unpublish one of the caller's own listings
      tags:
      - Listings
      description: |
        Seller lifecycle command. SF-B7 — a listing that fails validation
        (typically a legacy row that predates one of Listing's bounds) is
        answered with 422 and the field errors, never a 500 with an empty body.
      parameters:
      - name: access-token
        in: header
        required: false
        schema:
          type: string
      - name: client
        in: header
        required: false
        schema:
          type: string
      - name: uid
        in: header
        required: false
        schema:
          type: string
      responses:
        '401':
          description: unauthorized
        '200':
          description: successful
        '422':
          description: the listing fails validation
  "/api/v1/my/listings/{id}/activate":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    put:
      summary: activate one of the caller's own listings
      tags:
      - Listings
      description: |
        Seller lifecycle command. SF-B7 — a listing that fails validation
        (typically a legacy row that predates one of Listing's bounds) is
        answered with 422 and the field errors, never a 500 with an empty body.
      parameters:
      - name: access-token
        in: header
        required: false
        schema:
          type: string
      - name: client
        in: header
        required: false
        schema:
          type: string
      - name: uid
        in: header
        required: false
        schema:
          type: string
      responses:
        '401':
          description: unauthorized
        '200':
          description: successful
        '422':
          description: the listing fails validation
  "/api/v1/my/listings/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    put:
      summary: update one of the caller's own listings
      tags:
      - Listings
      description: |
        Edits a listing the caller owns. Photos are appended (never replaced) and
        removed by signed id via `removed_image_ids`.

        SF-B6 — changing `quantity` reconciles the listing's own status:

        * raising it above `sold_units` re-opens a `sold` listing as `active`,
          clears `sold_at`, and refreshes `expires_at` when the 30-day clock had
          already run out (so it comes back into the feed, not into the seller's
          Expired tab);
        * lowering it onto `sold_units` retires a live listing as `sold`;
        * lowering it BELOW `sold_units` is refused with 422 +
          `code: "quantity_below_sold_units"`. The seller's way out is to undo a
          sale first (`DELETE /api/v1/my/transactions/:id`, SF-B4).

        SF-B8 — the same endpoint enforces a second floor: lowering `quantity`
        below the units currently ON HOLD for a buyer is refused with 422 +
        `code: "quantity_below_held_units"`. The hold is never silently shrunk.
        The seller's way out is to release the hold
        (`PUT /api/v1/my/listings/:id/activate`) or set the quantity to at least
        the held count.

        The two floors report EXCLUSIVELY — whichever is higher raises the error,
        so `code` is one value and the minimum named in the message is always the
        minimum that actually works.
      parameters:
      - name: access-token
        in: header
        required: false
        schema:
          type: string
      - name: client
        in: header
        required: false
        schema:
          type: string
      - name: uid
        in: header
        required: false
        schema:
          type: string
      responses:
        '401':
          description: unauthorized
        '200':
          description: quantity raised — the sold-out listing re-opens with its stock
        '422':
          description: quantity below the units already sold
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                listing:
                  type: object
                  properties:
                    title:
                      type: string
                    price:
                      type: number
                    quantity:
                      type: integer
                      description: Total units; may not be below sold_units
        required: true
  "/api/v1/my/reviews/pending":
    get:
      summary: sold sales the caller still owes a review on
      tags:
      - Reviews
      description: Returns the caller's SOLD transactions (as buyer or seller) that
        they have not yet reviewed. Drives the rating prompt.
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '401':
          description: requires authentication
        '200':
          description: lists unreviewed sold sales
  "/api/v1/my/transactions":
    get:
      summary: list the caller's transactions (as buyer and/or seller)
      tags:
      - Transactions
      description: |
        Returns the current user's transactions — both the ones where they are
        the seller and the ones where they are the buyer. Optional `?as=buyer`
        or `?as=seller` narrows to a single role. TASK-TX01.
      parameters:
      - name: access-token
        in: header
        required: false
        schema:
          type: string
      - name: client
        in: header
        required: false
        schema:
          type: string
      - name: uid
        in: header
        required: false
        schema:
          type: string
      - name: as
        in: query
        required: false
        description: 'Optional role filter: ''buyer'' or ''seller'''
        schema:
          type: string
      - name: listing_id
        in: query
        required: false
        description: SF-B5 — narrow to one listing's ledger (the Sales screen)
        schema:
          type: integer
      - name: status
        in: query
        required: false
        description: 'Optional status filter: ''reserved'' or ''sold'''
        schema:
          type: string
      responses:
        '401':
          description: unauthorized
        '200':
          description: "?listing_id= narrows to one listing's ledger"
  "/api/v1/my/transactions/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    patch:
      summary: correct a recorded sale
      tags:
      - Transactions
      description: |
        SF-B4 — edit a sale the seller already recorded: its quantity, its price,
        and/or who it was to. `quantity: 0` means "this sale did not happen" and
        is handled exactly like DELETE.

        Restores stock, moves the trust counters, and reconciles the listing's own
        status (a `sold` listing re-opens as `active` when the correction leaves
        units unsold). Refused with 422 + `code: "sale_has_review"` when the sale
        already has a review AND the change would void it or move its buyer.
      parameters:
      - name: access-token
        in: header
        required: false
        schema:
          type: string
      - name: client
        in: header
        required: false
        schema:
          type: string
      - name: uid
        in: header
        required: false
        schema:
          type: string
      responses:
        '401':
          description: unauthorized
        '200':
          description: sale corrected; listing status and stock reconciled
        '422':
          description: the corrected quantity exceeds the listing's stock
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
                  description: New unit count; 0 voids the sale
                buyer_id:
                  type: integer
                  description: Reassign to another conversation participant
                clear_buyer:
                  type: boolean
                  description: Reassign to 'not on Hatiwal'
                final_price:
                  type: number
                  description: Per-unit price actually agreed
    delete:
      summary: void a recorded sale
      tags:
      - Transactions
      description: |
        SF-B4 — "Undo". Removes the sale, puts its units back in stock, gives back
        the seller's `sold_count` and the buyer's `bought_count` (never below
        zero), and re-opens the listing if this sale was what retired it.

        Refused with 422 + `code: "sale_has_review"` when the sale already has a
        review attached.
      parameters:
      - name: access-token
        in: header
        required: false
        schema:
          type: string
      - name: client
        in: header
        required: false
        schema:
          type: string
      - name: uid
        in: header
        required: false
        schema:
          type: string
      responses:
        '401':
          description: unauthorized
        '200':
          description: sale removed, stock restored, listing re-opened
        '422':
          description: the sale already has a review
  "/api/v1/my/shop_invites":
    get:
      summary: my pending invitations
      tags:
      - Shops — team
      description: Pending, unexpired EMAIL invitations addressed to the caller's
        CONFIRMED email, for open shops they are not in yet. An unconfirmed email
        sees none; link invites never show (no addressee). Answer with POST /shop_invites/{token}/accept
        or /decline. me.pending_shop_invites_count is the badge.
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: the invitations
        '401':
          description: signed out
  "/api/v1/reports":
    get:
      summary: list the current user's reports
      tags:
      - Reports
      description: Returns a paginated list of reports submitted by the authenticated
        user. Includes status, reason, and a safe reportable_label.
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '401':
          description: requires authentication
        '200':
          description: pagination meta is present
    post:
      summary: submit a report
      tags:
      - Reports
      description: Submits a polymorphic report against a Listing or User.
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '401':
          description: requires authentication
        '201':
          description: creates a report
        '422':
          description: rejects reporting own listing
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                report:
                  type: object
                  properties:
                    reportable_type:
                      type: string
                      enum:
                      - Listing
                      - User
                    reportable_id:
                      type: integer
                    reason:
                      type: string
                    description:
                      type: string
                  required:
                  - reportable_type
                  - reportable_id
                  - reason
  "/api/v1/transactions/{transaction_id}/reviews":
    post:
      summary: leave a review on a sold sale
      tags:
      - Reviews
      description: |
        The caller (a party to a SOLD transaction) rates the other party. The
        review is created hidden (double-blind) and revealed only once the
        counterparty also submits, or after the reveal window elapses.
      security:
      - bearer: []
      parameters:
      - name: transaction_id
        in: path
        required: true
        schema:
          type: integer
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '401':
          description: requires authentication
        '201':
          description: creates a hidden review
        '403':
          description: rejects a non-party
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                review:
                  type: object
                  properties:
                    rating:
                      type: integer
                      minimum: 1
                      maximum: 5
                    comment:
                      type: string
                  required:
                  - rating
