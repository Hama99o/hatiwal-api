  "/api/v1/my/listings/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    put:
      summary: update one of the caller's own listings
      tags:
      - Listings
      description: |
        Edits a listing the caller owns. Photos are appended (never replaced) and
        removed by signed id via `removed_image_ids`.

        OFFLINE phase 0 — `image_order[]` sets the photos' order: the signed ids
        of `image_attachments`, plus `new:<n>` for the n-th photo of this
        request's `images[]`. Unknown tokens are ignored; a photo left out of
        the list keeps its place after the listed ones (never deleted). Without
        the field, the order is unchanged.

        SF-B6 — changing `quantity` reconciles the listing's own status:

        * raising it above `sold_units` re-opens a `sold` listing as `active`,
          clears `sold_at`, and refreshes `expires_at` when the 30-day clock had
          already run out (so it comes back into the feed, not into the seller's
          Expired tab);
        * lowering it onto `sold_units` retires a live listing as `sold`;
        * lowering it BELOW `sold_units` is refused with 422 +
          `code: "quantity_below_sold_units"`. The seller's way out is to undo a
          sale first (`DELETE /api/v1/my/transactions/:id`, SF-B4).

        SF-B8 — the same endpoint enforces a second floor: lowering `quantity`
        below the units currently ON HOLD for a buyer is refused with 422 +
        `code: "quantity_below_held_units"`. The hold is never silently shrunk.
        The seller's way out is to release the hold
        (`PUT /api/v1/my/listings/:id/activate`) or set the quantity to at least
        the held count.

        The two floors report EXCLUSIVELY — whichever is higher raises the error,
        so `code` is one value and the minimum named in the message is always the
        minimum that actually works.

        OFFLINE §10.2 — `base` (optional): for each field sent, the value the
        client SAW when the edit was made (an edit queued offline). A field
        whose server value changed meanwhile is not overwritten: the other
        fields are applied, and the answer is 409 `code: "edit_conflict"` with
        `fields: {field: {yours, theirs, changed_at, changed_by_name}}` (the
        listing as it is now, too). The same value already there (`theirs ==
        yours`) is a success. Without `base` (1.1.x apps): last write wins.
      parameters:
      - name: access-token
        in: header
        required: false
        schema:
          type: string
      - name: client
        in: header
        required: false
        schema:
          type: string
      - name: uid
        in: header
        required: false
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        description: OFFLINE §10.1 — 8 to 64 letters, digits, - or _. A retry with
          the same key replays the first answer (one write); the same key with another
          body → 422.
        schema:
          type: string
      responses:
        '401':
          description: unauthorized
        '409':
          description: 'OFFLINE §10.2 — a field changed elsewhere since the client
            saw it: the rest is applied'
        '200':
          description: quantity raised — the sold-out listing re-opens with its stock
          content:
            application/json:
              example:
                listing:
                  address:
                  available_units: 5
                  bumped:
                  category:
                    icon: "\U0001F4E6"
                    id: 1054
                    kind: item
                    name_en: Category 1415
                    name_fa: دسته 1416
                    name_ps: کټاګورۍ 1416
                    name_ur: Category 1415
                    parent_id:
                    position: 1
                    slug: category-1390
