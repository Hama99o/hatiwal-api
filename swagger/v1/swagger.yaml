      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: the list, read-only for staff
        '403':
          description: not a member
  "/api/v1/shops/{shop_id}/members/{user_id}":
    delete:
      summary: remove a Staff member (owner)
      tags:
      - Shops — team
      security:
      - bearer: []
      parameters:
      - name: shop_id
        in: path
        required: true
        schema:
          type: integer
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '204':
          description: removed, told and logged
    patch:
      summary: change a member's role (owner)
      tags:
      - Shops — team
      description: 'role: manager | staff. Owner only (403 forbidden). The owner''s
        own role only changes by a transfer (422 cannot_change_owner); 422 invalid_role;
        404 not_a_member. Audit role_changed; push shop_membership_changed {reason:
        role_changed} to the person.'
      security:
      - bearer: []
      parameters:
      - name: shop_id
        in: path
        required: true
        schema:
          type: integer
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
