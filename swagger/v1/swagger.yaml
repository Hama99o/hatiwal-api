  "/api/v1/users/me":
    put:
      summary: report push registration (token, or why there is none)
      tags:
      - Users
      description: |-
        Send `push_token` once the app has one. When getting a token fails, send `push_registration_error` as "<stage>: <message>" (e.g. "token: Default FirebaseApp is not initialized"). The server keeps the last error only, strips control characters, caps it at 300 characters, and clears it when a token is saved. A blank string clears it too.

        OFFLINE §10.2 — `user.base` (optional): for the fields a person edits by hand (firstname, lastname, phone, bio, city, province, whatsapp_number), the value the client saw. One changed elsewhere meanwhile is not overwritten: the rest applies and the answer is 409 `code: "edit_conflict"` + `fields`. Prefs and the push fields never conflict.
      security:
      - bearer: []
      parameters:
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        description: OFFLINE §10.1 — 8 to 64 letters, digits, - or _. A retry with
          the same key replays the first answer (one write); the same key with another
          body → 422.
        schema:
          type: string
      responses:
        '200':
          description: stored; a reported error is kept until a token arrives
        '409':
          description: OFFLINE §10.2 — a hand-edited field changed elsewhere since
            the client saw it
        '401':
          description: requires authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    push_token:
                      type: string
                      maxLength: 200
                      example: ExponentPushToken[xxxxxxxx]
                    push_registration_error:
                      type: string
                      maxLength: 300
                      example: 'token: Default FirebaseApp is not initialized'
                    base:
                      type: object
                      additionalProperties: true
                      description: OFFLINE §10.2 — per hand-edited field sent, the
                        value the client saw
              required:
              - user
  "/api/v1/users/{user_id}/sold_listings":
    get:
      summary: list a seller's sold listings (public)
      tags:
      - Users
      description: |
        Returns a paginated list of sold listings for any publicly-active seller.
        Works for guests — authentication is optional. Returns 404 when the
        seller account has been deleted or is pending deletion.
      parameters:
      - name: user_id
        in: path
        required: true
        description: Seller's user ID
        schema:
          type: integer
      - name: page[number]
        in: query
        required: false
        description: 'Page number (default: 1)'
        schema:
          type: integer
      - name: access-token
        in: header
        required: false
        schema:
          type: string
      - name: client
        in: header
        required: false
        schema:
          type: string
      - name: uid
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: returns only that seller's sold listings (authenticated)
          content:
            application/json:
              example:
                listings:
                - address:
                  available_units: 1
                  bumped_at: '2026-10-27T09:43:04.649Z'
                  category:
                    icon: "\U0001F4E6"
