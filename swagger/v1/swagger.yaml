        seller account has been deleted or is pending deletion.
      parameters:
      - name: user_id
        in: path
        required: true
        description: Seller's user ID
        schema:
          type: integer
      - name: page[number]
        in: query
        required: false
        description: 'Page number (default: 1)'
        schema:
          type: integer
      - name: access-token
        in: header
        required: false
        schema:
          type: string
      - name: client
        in: header
        required: false
        schema:
          type: string
      - name: uid
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: returns only that seller's sold listings (authenticated)
        '404':
          description: seller not found
  "/api/v1/verification_requests/current":
    get:
      summary: the verification status card for the caller
      tags:
      - Verification
      security:
      - bearer: []
      parameters:
      - name: subject
        in: query
        required: false
        description: me (default). shop:<id> comes with SHOP-1.
