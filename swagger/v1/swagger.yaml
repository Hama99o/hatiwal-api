          description: the owner can't leave
  "/api/v1/shops/{shop_id}/transfer":
    post:
      summary: hand the shop to a member (owner)
      tags:
      - Shops — team
      description: 'The member becomes the owner; the old owner stays as a manager;
        shop chats move to the new owner (their seller is the owner); a Verified badge
        is dropped (it vouched for the old owner''s e-Tazkira). → { shop (owner view,
        the caller''s new role), me }. 422: cannot_transfer_to_self, not_a_member,
        shop_unavailable, verification_pending. 403 forbidden for anyone but the owner.'
      security:
      - bearer: []
      parameters:
      - name: shop_id
        in: path
        required: true
        schema:
          type: integer
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: transferred
        '422':
          description: to yourself
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
              required:
              - user_id
  "/api/v1/shops/{shop_id}/conversations":
    post:
      summary: Message shop (a chat without a product)
      tags:
      - Shops
      description: 'Find-or-create the caller''s one chat with the shop that has no
        product. 201 when created, 200 with the same chat after. `message` is optional.
        Refused: own shop / a shop you''re a member of (422 code own_shop), a shop
        that isn''t open (404), a blocked pair (422).'
      security:
      - bearer: []
      parameters:
      - name: shop_id
        in: path
        required: true
        schema:
          type: integer
      - name: access-token
        in: header
        required: true
        schema:
          type: string
      - name: client
        in: header
        required: true
        schema:
          type: string
      - name: uid
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: created; listing null, shop set
        '422':
          description: your own shop
        '404':
          description: a shop that isn't open
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
  "/api/v1/shops/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: a shop page (public)
      tags:
      - Shops
      responses:
        '200':
          description: the shop; phone only when phone_public
        '403':
          description: a suspended shop is not public
  "/api/v1/users/me/selling_as":
    patch:
